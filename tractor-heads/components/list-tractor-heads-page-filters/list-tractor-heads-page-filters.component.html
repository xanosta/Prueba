@let locations = locationsStore.locations();

<form [formGroup]="filtersForm" class="filters">
    <div class="filters__body">
        <div class="filter">
            <label class="filter__label">Matrícula</label>
            <input formControlName="tractorHeadPlate" pInputText />
        </div>
        <div class="filter">
            <label class="filter__label">Estado</label>
            <p-multiselect formControlName="tractorHeadStatus" [options]="statusOptions" />
        </div>
        <div class="filter">
            <label class="filter__label">Origen</label>
            <p-multiselect formControlName="originId" [options]="locations" optionLabel="name" optionValue="id" />
        </div>
        <div class="filter">
            <label class="filter__label">Destino</label>
            <p-multiselect formControlName="destinationId" [options]="locations" optionLabel="name" optionValue="id" />
        </div>
        <div class="filter">
            <label class="filter__label">Rango de fechas</label>
            <p-datepicker formControlName="dates" selectionMode="range" />
        </div>
    </div>
    <div class="filters__controls">
        <button (click)="applyFilters()" class="btn filters__apply-button">Aplicar filtros</button>
        <button (click)="resetFilters()" class="btn filters__reset-button">Restablecer filtros</button>
    </div>
</form>
