<div class="container-states-card">
  <p class="container-states-card__chip">{{ location() }}</p>
  @if(residueType()!.length > 0){
  <div class="container-states-card__container-chip">
    @for(residueType of residueType(); track residueType) {
    <residues-residue-type-chip [residueType]="residueType" class="fw-bold" />
    }
  </div>
  }
</div>
