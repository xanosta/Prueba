<form [formGroup]="editWeighingPlatformForm" class="form">
  <div class="form__section">
    <div class="form-group">
      <label for="name">Nombre</label>
      <input id="name" type="text" pInputText formControlName="name" />
    </div>
    <div class="form-group">
      <label for="location">Planta</label>
      <p-select
        id="location"
        formControlName="locationId"
        [options]="locationsStore.locations()"
        optionLabel="name"
        optionValue="locationId"
        placeholder="Selecciona una planta"
      ></p-select>
    </div>
    <div class="form-group">
      <label for="hopperId">Tolva</label>
      <input id="hopperId" type="number" pInputText formControlName="hopperId" />
    </div>
  </div>

  <div class="form__section">
    <div class="form-group">
      <label for="rfidReaderDeviceId">ID Lector RFID</label>
      <input id="rfidReaderDeviceId" type="text" pInputText formControlName="rfidReaderDeviceId" />
    </div>
    <div class="form-group">
      <label for="scaleDeviceId">ID Báscula</label>
      <input id="scaleDeviceId" type="text" pInputText formControlName="scaleDeviceId" />
    </div>
  </div>

  <div class="form__section">
    <div class="form-group">
      <label for="entryColumnDeviceId">ID Columna de Entrada</label>
      <input
        id="entryColumnDeviceId"
        type="text"
        pInputText
        formControlName="entryColumnDeviceId"
      />
    </div>
    <div class="form-group">
      <label for="exitColumnDeviceId">ID Columna de Salida</label>
      <input id="exitColumnDeviceId" type="text" pInputText formControlName="exitColumnDeviceId" />
    </div>
  </div>
</form>

<div class="form__controls">
  <button (click)="cancel()" class="btn btn__secondary">Cancelar</button>
  <button (click)="save()" class="btn btn__primary" [disabled]="editWeighingPlatformForm.invalid">
    Guardar
  </button>
</div>
