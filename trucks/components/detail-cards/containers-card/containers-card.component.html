<div class="truck-container-card">
  @if (!containers() || containers()?.length === 0) {
      <div>-</div>
    } @else {
      @for (cont of containers(); track cont) {
        <div class="truck-container-card__container br-large border-gray-redesing-light bg-light-gray">
          {{ cont.code }}
        </div>
      }
    }
</div>
