<form [formGroup]="newTruckForm" class="form">
  <div class="form__section">
    <div class="form-group">
      <p-floatlabel variant="in">
        <p-autocomplete fluid
          id="plate"
          formControlName="plate"
          [suggestions]="plateSuggestions()"
          (completeMethod)="filterPlateSuggestions($event)"
          class="form-group__field"
        />
        <label for="plate">{{
          "newTruckEntry.form.plate" | translate
        }}</label>
      </p-floatlabel>
    </div>
  </div>
  <div class="form__section">
    <div class="form-group">
      <p-floatlabel variant="in">
        <p-multiselect
          id="originIds"
          formControlName="originIds"
          [options]="originsOptions"
          styleClass="form-group__field"
          size="small"
        />
        <label for="originIds">{{
          "newTruckEntry.form.origin" | translate
        }}</label>
      </p-floatlabel>
    </div>
    <div class="form-group">
      <p-floatlabel variant="in">
        <p-select
          id="residueTypeId"
          formControlName="residueTypeId"
          [options]="residueTypeOptions"
          styleClass="form-group__field"
        />
        <label for="residueTypeId">{{
          "newTruckEntry.form.residueType" | translate
        }}</label>
      </p-floatlabel>
    </div>
  </div>
  <div class="form__section">
    <div class="form-group">
      <p-floatlabel variant="in">
        <p-inputnumber
          id="arrivalWeight"
          formControlName="arrivalWeight"
          suffix=" kg"
          class="form-group__field"
        />
        <label for="arrivalWeight">{{
          "newTruckEntry.form.entryWeight" | translate
        }}</label>
      </p-floatlabel>
    </div>
    <div class="form-group">
      <p-floatlabel variant="in">
        <p-inputnumber
          id="exitWeight"
          formControlName="exitWeight"
          suffix=" kg"
          class="form-group__field"
        />
        <label for="exitWeight">{{
          "newTruckEntry.form.exitWeight" | translate
        }}</label>
      </p-floatlabel>
    </div>
    <div class="form-group">
      <label class="form-group__label" for="entryWeight">{{
        "newTruckEntry.form.residueWeight" | translate
      }}</label>
      <p id="entryWeight" class="form-group__field">
        {{ residueWeight }}
      </p>
    </div>
  </div>
  <div class="form__section">
    <div class="form-group">
      <p-floatlabel variant="in">
        <p-select
          id="hopperId"
          formControlName="hopperId"
          [options]="hoppersOptions"
          styleClass="form-group__field"
        />
        <label for="hopperId">{{
          "newTruckEntry.form.hopper" | translate
        }}</label>
      </p-floatlabel>
    </div>
    <div class="form-group">
      <p-floatlabel variant="in">
        <p-datepicker
          inputId="dateTimeUnload"
          formControlName="dateTimeUnload"
          [showTime]="true"
          [iconDisplay]="'input'"
          [showIcon]="true"
          [maxDate]="currentDate"
          styleClass="form-group__field"
        />
        <label for="dateTimeUnload">{{
          "newTruckEntry.form.unloadDate" | translate
        }}</label>
      </p-floatlabel>
    </div>
  </div>

  <div class="form__controls">
    <button (click)="handleCancel()" class="btn btn__secondary">
      {{ "newTruckEntry.actions.cancel" | translate }}
    </button>
    <button (click)="handleSubmit()" class="btn btn__primary">
      {{ "newTruckEntry.actions.submit" | translate }}
    </button>
  </div>
</form>
